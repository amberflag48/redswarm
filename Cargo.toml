[package]
name = "redswarm"
version = "0.1.0"
edition = "2024"
description = "A hands-free, sophisticated P2P ratio cheater for private BitTorrent trackers."
license = "MIT OR Apache-2.0"
keywords = ["bittorrent", "tracker", "ratio", "cheater", "stealth"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
askama = "0.12"
rand = "0.9"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-util = "0.7"
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["compression-gzip", "fs"] }
percent-encoding = "2"
toml = "0.8"
crab_nat = "0.7"
arc-swap = "1.9.2"
notify = "8.2.0"
libc = "0.2"
socket2 = "0.6"

[profile.release]
lto = true
codegen-units = 1
