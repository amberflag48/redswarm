# RedSwarm configuration.
# Generated by the settings UI - edits via the web UI or a text editor are both supported.
# Override this file's path by setting the REDSWARM_CONFIG env var.

[server]
bind_addr = "0.0.0.0:3000"
db_url = "sqlite:redswarm.db"
log_filter = "redswarm=info"
rebind_retry_secs = 2
sse_keepalive_secs = 15

[http]
timeout_secs = 60

[tracker]
peer_port = 6881
default_interval_secs = 1800
min_interval_secs = 60
max_interval_secs = 86400

[engine]
tick_interval_secs = 1
stat_interval_secs = 5
announce_jitter_pct = 5.0
leech_upload_factor = 0.5
burst_choke_probability = 0.3
stop_grace_secs = 15

[database]
max_connections = 4

[ui]
event_log_limit = 300

[defaults]
mode = "download_and_upload"
speed_mode = "dynamic"
upload_bps = 524288
download_bps = 1048576
jitter_pct = 20
ramp_up_secs = 120
start_download_pct = 0
freeze_on_zero_leechers = true
freeze_on_zero_seeders = true
goal_enabled = false
goal_direction = "upload"
goal_upload_target = 0
goal_download_target = 0
goal_target_secs = 0
goal_reached_action = "stop"
goal_reached_bps = 0

[swarm_defaults]
avg_leecher_download_bps = 3000000
seed_share_factor = 0.8
fair_share_multiplier = 1.0
max_upload_bps = 0
max_download_bps = 0

[peer_server]
enabled = true
max_connections = 10000
max_per_ip = 20
handshake_timeout_secs = 5
write_timeout_secs = 5
idle_timeout_secs = 240
body_read_timeout_secs = 15
accept_error_backoff_ms = 100
capture_keepalive_secs = 90

[nat]
gateway_ip = ""
lease_lifetime_secs = 60
renew_interval_secs = 45

[watcher]
debounce_ms = 300

[[clients]]
label = "qBittorrent"
version = "5.2.2"
peer_id_prefix = "-qB5220-"
user_agent = "qBittorrent/5.2.2"
query = "info_hash={info_hash}&peer_id={peer_id}&port={port}&uploaded={uploaded}&downloaded={downloaded}&left={left}&corrupt=0&key={key}{event}&numwant={numwant}&compact=1&no_peer_id=1&supportcrypto=1&redundant=0"
numwant = 200
aliases = []
reserved_bytes = "0000000000180005"
fast_extension = true
keepalive_secs = 90
v_string = "qBittorrent/5.2.2"
reqq = 500
send_upload_only = true
send_complete_ago = -1
send_yourip = true
key_format = "upper_hex"

[clients.m_dict]
lt_donthave = 7
share_mode = 8
upload_only = 3
ut_holepunch = 4
ut_metadata = 2
ut_pex = 1

[[clients]]
label = "Transmission"
version = "4.1.2"
